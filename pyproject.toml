[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdmaia"
version = "0.1.0"
description = "Molecular Dynamics Machine-learning Assisted Interaction Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "Sarath Chandra Dantu"}
]
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scipy>=1.8",
  "MDAnalysis>=2.4",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
mdmaia = "mdmaia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
